version: '3.7'
services:
  postgres_slave:
    container_name: postgres_slave_cont
    image: "postgres:15"
    restart: 'unless-stopped'
    environment:
      - POSTGRES_DB=version_db
      - POSTGRES_USER=version_user
      - POSTGRES_PASSWORD=version_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data    
    command: |
      bash -c "
      until pg_isready -h 10.18.13.2 -U rep_user; do
        echo 'Waiting for master...';
        sleep 5;
      done;
      if [ ! -f /var/lib/postgresql/data/standby.signal ]; then
        echo 'Master is ready. Taking base backup...';
        rm -rf /var/lib/postgresql/data/*;
        export PGPASSWORD='fd674vfddQPDsssvfcds749' && pg_basebackup -h 10.18.13.2 -p 5432 -U rep_user -D /var/lib/postgresql/data -Fp -Xs -R;
        echo 'Backup complete. Starting PostgreSQL as standby...';
      fi
      exec docker-entrypoint.sh postgres -c 'hot_standby=on'
      "
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        tag: "{{.ImageName}}|{{.Name}}"
    ports:
      - 5545:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready  -U version_user -d version_db"]
      interval: 10s
      timeout: 5s
      retries: 5   
    networks:
      default:
        ipv4_address: 10.18.13.3
 
     
networks:
  default:
    external: true
    name: postgres
      